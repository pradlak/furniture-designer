<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projektant mebli online — darmowe projektowanie szafek i zabudów 3D</title>
    <meta
      name="description"
      content="Darmowy projektant mebli w przeglądarce: odwzoruj wnękę lub poddasze ze skosami, zaprojektuj korpusy, blendy i blat w 3D, a potem pobierz listę formatek do rozkroju (CSV). Bez rejestracji."
    />
    <meta name="theme-color" content="#2563eb" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="canonical" href="https://meblesamemu.pl/" />

    <!-- Podgląd linku przy udostępnianiu (Facebook, komunikatory) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pl_PL" />
    <meta property="og:site_name" content="Projektant mebli" />
    <meta property="og:url" content="https://meblesamemu.pl/" />
    <meta property="og:title" content="Projektant mebli online — zaprojektuj szafkę lub zabudowę wnęki w 3D" />
    <meta
      property="og:description"
      content="Odwzoruj wnękę, zaprojektuj korpusy z blendami i blatem, pobierz listę formatek do rozkroju. Za darmo, w przeglądarce."
    />
    <meta name="twitter:card" content="summary" />

    <!-- Dane strukturalne: darmowa aplikacja webowa -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Projektant mebli",
        "url": "https://meblesamemu.pl/",
        "description": "Darmowy projektant mebli w przeglądarce: wnęki i skosy, korpusy, blendy, blat, lista formatek do rozkroju.",
        "applicationCategory": "DesignApplication",
        "operatingSystem": "Dowolny (przeglądarka internetowa)",
        "inLanguage": "pl",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "PLN" }
      }
    </script>

    <!-- Statystyki odwiedzin (Umami — bez ciasteczek) -->
    <script defer src="https://cloud.umami.is/script.js" data-website-id="39838671-7a5f-40d9-9c8e-09fd94afeb92" data-domains="meblesamemu.pl,www.meblesamemu.pl"></script>
  </head>
  <body>
    <header id="toolbar" class="toolbar"></header>
    <main class="layout">
      <aside class="panel">
        <nav class="tabs" id="tabs">
          <button type="button" data-tab="space-panel" class="active">Przestrzeń</button>
          <button type="button" data-tab="furniture-panel">Meble</button>
          <button type="button" data-tab="trims-panel">Blendy i blaty</button>
          <button type="button" data-tab="materials-panel">Materiały</button>
        </nav>
        <div id="space-panel" class="tab-content"></div>
        <div id="furniture-panel" class="tab-content" hidden></div>
        <div id="trims-panel" class="tab-content" hidden></div>
        <div id="materials-panel" class="tab-content" hidden></div>
      </aside>
      <div class="panel-resizer" id="panel-resizer" title="Przeciągnij, aby zmienić szerokość panelu (dwuklik — domyślna)"></div>
      <section id="viewport" class="viewport">
        <div class="viewport-help">
          <b>Klik</b> — zaznacz korpus · <b>przeciągnij</b> — przesuń (Shift: w pionie, Alt: bez przyciągania)<br />
          <b>Strzałki</b> — o 10 mm (Shift: 100 mm) · <b>PgUp/PgDn</b> — w pionie · <b>Ctrl+D</b> — duplikuj ·
          <b>Del</b> — usuń · <b>Ctrl+Z</b> — cofnij
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
